[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则-企业AI平台专用

;去广告：支持
;自动测速：不支持
;微软分流：限制为直连/阻断
;苹果分流：限制为直连/阻断
;增强中国IP段：支持
;增强国外GFW：阻断

;设置规则标志位
ruleset=🎯 全球直连,https://sub.blyu.cn/ACL4SSR/Clash/LocalAreaNetwork.list
ruleset=🛑 广告拦截,https://sub.blyu.cn/ACL4SSR/Clash/BanAD.list
ruleset=🍃 应用净化,https://sub.blyu.cn/ACL4SSR/Clash/BanProgramAD.list

;AI平台优先匹配，允许按单独策略组选择节点
ruleset=💬 Ai平台,https://sub.blyu.cn/ACL4SSR/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,https://sub.blyu.cn/ACL4SSR/Clash/Ruleset/OpenAi.list

;国内与本地网络保持直连
